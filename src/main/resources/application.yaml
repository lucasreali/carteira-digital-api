spring:
  application:
    name: wallet
  datasource:
    url: jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

wallet:
  security:
    # HMAC-SHA256 key, must be at least 32 bytes. Override in every real environment.
    jwt-secret: ${WALLET_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    token-ttl: 1h
